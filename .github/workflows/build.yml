name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Make gradlew executable
      run: chmod +x gradlew          # <--- ДОБАВЬ ЭТУ СТРОКУ
    - name: Build with Gradle
      run: ./gradlew build
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: mechaura
        path: build/libs/*.jar
